name: Build Vibe FireTV APK

on:
  push:
    branches: [ "main", "master", "**" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install Rust & Android NDK Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-linux-androideabi,aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Compile Rust Native Engine (Fire TV 32-bit & 64-bit)
        working-directory: rust-core
        run: |
          cargo ndk \
            -t armeabi-v7a \
            -t arm64-v8a \
            -o ../app/src/main/jniLibs \
            build --release

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Release & Debug APKs
        run: gradle assembleRelease assembleDebug --stacktrace

      - name: Upload Vibe Release APK (Fire TV Optimized)
        uses: actions/upload-artifact@v4
        with:
          name: Vibe-FireTV-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Upload Vibe Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Vibe-FireTV-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
